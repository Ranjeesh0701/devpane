[package]
name = "devpane"
version = "0.2.0"
edition = "2024"
authors = ["Ranjeesh"]
description = "A terminal-first multi-process workspace and development dashboard"
readme = "README.md"
license = "MIT"
repository = "https://github.com/Ranjeesh0701/devpane"
homepage = "https://github.com/Ranjeesh0701/devpane"
keywords = ["terminal", "process-manager", "tui", "workspace", "cli"]
categories = ["command-line-utilities", "development-tools"]
include = [
    "/src/**/*",
    "/examples/**/*",
    "/Cargo.toml",
    "/README.md",
    "/LICENSE",
]

[dependencies]
crossterm = "0.29.0"
dirs = "7.0.0"
interprocess = "2.4.5"
libc = "0.2.190"
portable-pty = "0.9.0"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml_ng = "0.10.0"
uuid = { version = "1.28.0", features = ["v4", "serde"] }
vt100 = "0.15.2"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }
