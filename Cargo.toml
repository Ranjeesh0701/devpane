[package]
name = "devpane"
version = "0.2.0"
edition = "2024"
license = "MIT"

[dependencies]
crossterm = "0.29.0"
dirs = "7.0.0"
interprocess = "2.4.5"
libc = "0.2.190"
portable-pty = "0.9.0"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml_ng = "0.10.0"
uuid = { version = "1.28.0", features = ["v4", "serde"] }
vt100 = "0.15.2"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }
